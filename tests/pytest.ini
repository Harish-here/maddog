[pytest]
# tests/fixtures holds practice repos the model-driven harness copies into a
# throwaway workdir and runs there (see harness/core/fixture.py) — their own
# tests/ subfolders are not meant to be collected in place by a top-level
# `pytest tests -q` run (their imports resolve only inside that copied
# workdir, on its own sys.path). tests/results holds run output, never test
# code. tests/.venv is this venv itself.
norecursedirs = fixtures results .venv
