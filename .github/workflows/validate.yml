name: Validate manifest and frontmatter

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

# One job, no model runs. .github/validate.sh holds every check; the job only
# prepares the machine. Merging needs this job (`validate`) to pass.
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the harness tests and the release gate read main's history
      - name: Make a local main branch from origin/main
        run: git rev-parse --verify -q main || git branch main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: pip install -r tests/requirements.txt
      - name: Install jq if missing
        run: command -v jq || (sudo apt-get update && sudo apt-get install -y jq)
      - run: bash .github/validate.sh
